# Findings from PMC7568366 (Yan et al. 2020, BMC Vet Res 16:392, CC BY 4.0) for PRJNA430317 (study 3).
# Loaded into core.finding / core.finding_level (design doc §5.8) by app.ingest.findings, as tier 'curated'
# only once signed below. Drafted by Claude 2026-11-10, for review.
#
#   python scripts/check_findings_quotes.py conf/findings/PRJNA430317.yml /home/fontanella/lab/raw/europepmc/20261110T132414Z/PMC7568366
#   python -m app.ingest.findings conf/findings/PRJNA430317.yml --dry-run
#
# Rules from studies 1-2, unchanged: store what the paper says and where it came from, never guess; nulls are
# findings with their scope; omnibus stays omnibus; no effect sizes from text; a direction the text implies but
# doesn't state is flagged; a claim with no printed statistic is stored without one, flagged.
# Decided 2026-11-10 (Rodrigo; handoff-2026-11-10-study3 "Findings: decided"), migrations a8f4d5f5fd45
# (t-test, Kruskal-Wallis) and d2362d368390 (feature kind phylum):
#   - host scope: growth only (BW d39, ADG d0-d39, feed:gain d0-d39); carcass CT, serum, IMF, myofiber and gene
#     outcomes are not findings
#   - baseline (d0 feces, before the diets): alpha, beta and the four phyla as no_difference findings, flag
#     'baseline'; the randomization balance check is a query
#   - endpoint phylum P values as printed, stat kind p, flag adjustment_unclear (fact ambiguity-adjusted-p);
#     'tended to' = no_difference + the printed P, flag authors_trend (study 2's authors_marginal rule)
#   - F/B ratio: not stored (derived from two phyla stored here)
#   - genus printed 'Misuokella' → label Mitsuokella, flag printed_as (the quote keeps the printed spelling)
# Carried over from study 2 (not asked again):
#   - feed:gain: the text says only "improved feed conversion efficiency" → decrease, flag direction_from_improved
#   - endpoint beta "significant separate clustering" → differs, omnibus, no statistic, flagged
#
# Test names from the Methods ('Statistics analysis'): growth Student's t-test; alpha and taxa Kruskal-Wallis;
# beta PERMANOVA (999 permutations). BH correction; significant = adjusted P < 0.05.
# Contrast: every pairwise claim is antibiotics vs control (the design's two levels); beta is omnibus over both.
# Site / material / age: feces d0 = UBERON:0001988, material not stated (null), age 28/28; caecum UBERON:0001153
# and colon UBERON:0001155 digesta post mortem, age 67/67 (facts sampling-schedule, material-caecum/-colon).
# Taxonomy: not set (the reference database is in Supplementary S1.3, not in the JATS).
#
# Review points (Claude's readings, not decisions yet):
#   R1 endpoint alpha nulls: the sentence says only "the alpha diversity indices"; expanded to the three named
#      in the baseline sentence of the same Table S3 (fact alpha-indices), flag indices_from_fact. Alternative:
#      not stored.
#   R2 genera: the decrease sentence prints no P; the increase sentence prints "(P < 0.05)" unqualified. Both
#      cite Fig. 7, whose legend says "Adjusted p value lower than 0.05" → every genus claim takes the legend's
#      Q < 0.05 (source figure_legend), not the text's P. The parenthesis closes the hollow-diamond (lower)
#      sentence; read as covering both marks, flag legend_scope on all 16.
#   R3 not findings: baseline "none of the OTUs were significantly differentiated" (no single feature; would
#      need a feature set of every genus, Fig. S4 is supplementary); class/order/family (supplementary only).
#
# Counts: 41 claims = growth 3 + baseline 8 (alpha 3, beta 1, phyla 4) + endpoint alpha 6 + endpoint beta 2
#         + endpoint phyla 6 + genera 16 (caecum 4 down / 2 up, colon 5 down / 5 up). No group values (figures).

bioproject: PRJNA430317
pmcid: PMC7568366
experiment: main
review:
  reviewed_by: Rodrigo Fontanella
  reviewed_on: 2026-11-10

claims:
  # ════ growth, d0-d39 = days 28-67 of life (t-test; P in the text) ═══════════════════════════════════════════
  - id: h-bw67-antibiotics-control
    section: &s_growth Effects of antibiotic exposure on growth rate and carcass composition of piglets
    quote: &q_bw "After 39 days' exposure, an effect was observed in terms of body weight and growth rate, with antibiotic-treated piglets growing faster than control piglets (Fig. 2a and b) (P < 0.05)."
    measure: body_weight
    age: {from: 67, to: 67}
    contrast: &pair {kind: pairwise, treatment: antibiotics, reference: control}
    direction: increase
    test: &t_test {name: t-test}
    stat: &st_text05 {kind: p, op: "<", value: 0.05, scope: contrast, source: text}
    figure: Fig. 2a
    flags: ["direction_from_growing_faster: 'growing faster' covers body weight and growth rate together"]

  - id: h-adg-antibiotics-control
    section: *s_growth
    quote: *q_bw
    measure: average_daily_gain
    age: {from: 28, to: 67}
    contrast: *pair
    direction: increase
    test: *t_test
    stat: *st_text05
    figure: Fig. 2b

  - id: h-fcr-antibiotics-control
    section: *s_growth
    quote: "Antibiotic administration improved the feed conversion efficiency of the piglets (Fig. 2c) (P < 0.05)."
    measure: feed_conversion_ratio
    age: {from: 28, to: 67}
    contrast: *pair
    direction: decrease
    test: *t_test
    stat: *st_text05
    figure: Fig. 2c
    flags: ["direction_from_improved: the text says 'improved feed conversion efficiency'; Fig. 2c plots feed:gain, so improved = lower"]

