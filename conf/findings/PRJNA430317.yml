    site: &feces UBERON:0001988
    material: null
    measure: alpha_diversity
    about: {feature: {kind: alpha_index, label: Chao1}}
    age: &d28 {from: 28, to: 28}
    contrast: *pair
    direction: no_difference
    test: &t_kw {name: Kruskal-Wallis}
    flags: &fl_base_s3 ["baseline: d0, before the diets (fact sampling-schedule)",
                        "supplementary_table_s3: the statistic is in Additional file Table S3, not in the full text"]

