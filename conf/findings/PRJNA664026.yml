# Findings from PMC8001633 (Rabelo-Ruiz et al. 2021, Antibiotics 10:269, CC BY) for PRJNA664026 (study 2).
# Loaded into core.finding / core.finding_level / core.finding_group_value (design doc §5.8) by
# app.ingest.findings, as tier 'curated' only once signed below. Drafted by Claude 2026-11-07, for review.
#
#   python scripts/check_findings_quotes.py conf/findings/PRJNA664026.yml /home/fontanella/lab/raw/europepmc/20261017T120903Z/PMC8001633
#   python -m app.ingest.findings conf/findings/PRJNA664026.yml --dry-run
#
# Rules from study 1 (2026-10-11), unchanged: store what the paper says and where it came from, never guess; nulls
# are findings with their scope; omnibus stays omnibus, nothing is turned into pairs; no effect sizes from text.
# Decided 2026-11-07 (Rodrigo; handoff-2026-11-07 §4a), migration 9dbf58ea10c0, loader 55066db:
#   Q1  growth results are host-measure findings: no site, no 'about', an age window (days of life)
#   Q2  'differs' for every significant omnibus test (it says the groups differ, not which way)
#   Q2b the printed F / pseudo-F and d.f. are stored (test block); every number from a table is stated here
#       AND must equal its cell (the loader checks p with its operator, statistic, d.f., means, spreads)
#   Q2c p = 0.001 (PERMANOVA, 999 permutations) stored as printed, '=', with flag permutation_floor
#   Q3  every diversity finding carries flag rarefaction_exclusion (fact paper-sample-exclusion); n_analysed is
#       given only where the row's own d.f. give it, with the arithmetic
#   Q4  Treatment pooled over the four regions (Tables 1-2) → site UBERON:0000160 (intestine); region,
#       interaction, sex, room and covariate terms are NOT findings (facts analysis-model-*)
#   Q6  Tables 1 and 4 means per treatment → group_values; spread_kind 'unstated' (fact ambiguity-table-spread)
#   Q7  "marginally significant (p = 0.080)" → direction as stated, p as printed, flag authors_marginal
#   Q8  pre-starter / starter claims (Supplementary Table S2, not in the JATS) → stored without a statistic,
#       flagged; "intermediate values" is not stored (no test, no direction against one group)
#   Q9  initial body weight (day 28, F printed "<0.01") → curation fact baseline-bw-balanced, not a finding
# Not findings: class / genus percentages (§3.1, Figure 1: descriptive, no test); the PCoA sentences (§3.2: no
# statistic, unclear scope → fact ambiguity-pcoa-treatment).
#
# Material: digesta for every microbiome finding ("approximately 100 mg of gut content were collected", §2.2).
# Age: 70/70 for microbiome findings ("At the end of the experiment (70 days old)", §2.2 = fact sampling-age).
# Test names from the Methods (§2.6), not the captions: alpha GLM, beta PERMANOVA, productive GLMM, post hoc LSD.
#
# Counts: 45 claims = whole gut 4 (Table 1-2) + per region 8 (Table 3) + alpha pairwise 16 (§3.1)
#         + growth omnibus 6 (Table 4) + growth pairwise 7 (§3.3, Figure 4) + growth stages 4 (§3.3, Table S2);
#         group values 2 × 3 (Table 1) + 6 × 3 (Table 4) = 24.

