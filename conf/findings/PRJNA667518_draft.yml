  - id: otu-cae-dig-hf-lf-counts
    about: {feature_set: top200-otus-cae-dig}
    contrast: {kind: pairwise, treatment: HF, reference: LF}
    site: UBERON:0001153
    material: digesta
    measure: relative_abundance
    direction: counts
    counts: {increase: 44, decrease: 19}
