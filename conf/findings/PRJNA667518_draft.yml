      kind: Q
      op: "<"
      value: 0.05
      scope: unknown
      source: methods
      section: Statistical Analysis
      quote: "For variables with a treatment Q < 0.05, the LOG2 fold change and respective standard errors, were calculated comparing LF vs. HF, HF vs. HF+XY, and HF vs. HF+AX."
    effect: null
    figure: "Figure 8B"
    section: PICRUSt2 Targeted Gene Characterizations
    quote: "The addition of AXOS to HF increased acetate-CoA ligase (ADP-forming), oligosaccharide reducing-end xylanase, and alpha-galactosidase predicted gene counts in the cecal mucosa."
