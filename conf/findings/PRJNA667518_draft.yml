    site: UBERON:0001153
    material: digesta
    measure: relative_abundance
    direction: increase
    stat:
      kind: Q
      op: "<"
      value: 0.05
      scope: unknown
      source: figure_legend
      section: Treatment Modulation of the 200 Most Abundant OTUs in the Cecal Contents
      quote: "or OTUs with a contrast value of Q < 0.05 from the 200 most abundant OTUs among treatments present in the cecal contents."
    effect: null
    figure: "Figure 4B"
    section: Treatment Modulation of the 200 Most Abundant OTUs in the Cecal Contents
    quote: "and increased the abundance of OTU_160_Faecalibacterium"
    note: "OTU ids are per site × material clustering: OTU_160 in caecal mucosa is Acetitomaculum (next claim)"

  - id: otu-cae-muc-ax-hf-otu160
