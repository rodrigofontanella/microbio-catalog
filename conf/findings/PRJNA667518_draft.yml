# DRAFT findings from PMC8024495 (Petry et al. 2021, Front. Microbiol., CC BY) for PRJNA667518. Revision 2.
# Not loaded anywhere: this file designs the findings table (design doc §5.8, proposed). Review, then sign.
#
#   python scripts/check_findings_quotes.py conf/findings/PRJNA667518_draft.yml /home/fontanella/lab/raw/europepmc/20261011T090319Z/PMC8024495
#
# Rules agreed 2026-10-11 (Rodrigo):
#   - store what the paper says, mark where it came from, never guess
#   - null results ARE findings, always with their scope (what was tested, at which threshold)
#   - counts over a set ("44 up, 19 down of the top 200 OTUs") ARE findings, about a feature SET, never a feature
#   - a statistic printed only in a figure legend or the Methods is stored with that source and its quote
#   - groupings stay groupings; omnibus tests stay omnibus; nothing is turned into pairs
#   - enzymes by name only: EC numbers would be inferred, so they come later at a lower tier
#   - effect: null everywhere: log2 fold changes exist only as figure images (Figures 3–8)
#
# What the paper's Q values refer to is UNCLEAR, so stat.scope is 'unknown' for every Q here:
#   - Methods: "For variables with a treatment Q < 0.05, the LOG2 fold change … were calculated comparing
#     LF vs. HF, HF vs. HF+XY, and HF vs. HF+AX"  → a treatment (omnibus) Q gates the contrasts
#   - Figure 4–7 legends: "OTUs with a contrast value of Q < 0.05"  → a contrast Q
#   - the null in caecal contents (HF vs HF+AX, Q > 0.10 for the top 20 genera) is only possible for a
#     contrast Q: HF vs LF did differ in the same site, so the treatment Q can't exceed 0.10 for all 20
# Diversity p values are clear: "Least square means were separated using Fisher's Least Significant
# Difference test" → pairwise (scope contrast); an overall "did not differ (p = 0.117)" is the treatment test.
#
# Shape (each key is a proposed column; design doc §5.8):
#   about       exactly one of feature {kind, label, rank, otu_dataset?} | feature_set: <id below>
#   contrast    {kind: pairwise, treatment, reference} | {kind: omnibus, levels} | {kind: grouping, higher, lower}
#               every level must be a diet level of conf/designs/PRJNA667518.yml
#   site        UBERON term; material digesta | mucosa | null (= not stated)
#   measure     relative_abundance | alpha_diversity | predicted_gene_count
#   direction   increase | decrease | no_difference | counts   (counts: only for a feature set, with counts:)
#   stat        {kind Q|p, op, value, scope treatment|contrast|unknown, source text|figure_legend|methods,
#                section + quote when the source isn't the claim's own sentence}

bioproject: PRJNA667518
pmcid: PMC8024495
experiment: main
taxonomy: SILVA 132 (mothur v1.40.4, 99 % OTUs)
review:
  reviewed_by: null
  reviewed_on: null

feature_sets:
  - id: top20-genera-cae-dig
    member_kind: genus
    definition: "20 most abundant genera"
    size: 20
    site: UBERON:0001153          # caecum
    material: digesta
  - id: top200-otus-cae-dig
    member_kind: otu
    definition: "200 most abundant OTUs"
    size: 200
    site: UBERON:0001153
    material: digesta
    otu_dataset: "caecum digesta clustering"

claims:
  # ---- genus level, Figure 3 ------------------------------------------------------------------
  - id: g-cae-dig-hf-lf-lactobacillus
    about: {feature: {kind: genus, label: Lactobacillus, rank: genus}}
    contrast: {kind: pairwise, treatment: HF, reference: LF}
    site: UBERON:0001153
    material: digesta
    measure: relative_abundance
    direction: decrease
    stat: {kind: Q, op: "<", value: 0.05, scope: unknown, source: text}
    effect: null
    figure: "Figure 3"
    section: Treatment Modulation of Microbial Genera in the Cecum
    quote: "Relative to LF, HF increased Treponema_2 and Ruminococcaceae_UCG-005, and reduced Turicibacter and Lactobacillus in cecal contents (Figure 3; Q < 0.05)."

  - id: g-cae-muc-xy-hf-faecalibacterium
    about: {feature: {kind: genus, label: Faecalibacterium, rank: genus}}
    contrast: {kind: pairwise, treatment: HF+XY, reference: HF}
    site: UBERON:0001153
    material: mucosa
    measure: relative_abundance
    direction: increase
    stat: {kind: Q, op: "<", value: 0.05, scope: unknown, source: text}
    effect: null
    figure: "Figure 3"
    section: Treatment Modulation of Microbial Genera in the Cecum
    quote: "Relative to HF, HF+XY increased Faecalibacterium in the cecal mucosa, and decreased the prevalence of Campylobacter (Q < 0.05)."

  - id: g-col-dig-xy-hf-lactobacillus
    about: {feature: {kind: genus, label: Lactobacillus, rank: genus}}
    contrast: {kind: pairwise, treatment: HF+XY, reference: HF}
    site: UBERON:0001155          # colon
    material: digesta
    measure: relative_abundance
    direction: increase
    stat: {kind: Q, op: "<", value: 0.05, scope: unknown, source: text}
    effect: null
    figure: "Figure 3"
    section: Treatment Modulation of Microbial Genera in the Colon
    quote: "Contrarily in the colonic contents, when compared to HF, HF+XY increased the abundance of Megasphaera and Lactobacillus but decreased the prevalence of Rikenellaceae_RC9_gut_group and Treponema_2 (Q < 0.05)."

  - id: g-col-muc-xy-hf-campylobacter
    about: {feature: {kind: genus, label: Campylobacter, rank: genus}}
    contrast: {kind: pairwise, treatment: HF+XY, reference: HF}
    site: UBERON:0001155
    material: mucosa
    measure: relative_abundance
    direction: decrease
    stat: {kind: Q, op: "<", value: 0.05, scope: unknown, source: text}
    effect: null
    figure: "Figure 3"
    section: Treatment Modulation of Microbial Genera in the Colon
    quote: "Moreover, the addition of xylanase to HF increased the abundance of Lactobacillus, Gammaproteobacteria_unclassified, and Ruminococcaceae_UCG-014 in the colonic mucosa, but decreased the abundance of Campylobacter, Streptococcus, and Helicobacter (Q < 0.05)."

  - id: g-col-muc-xy-hf-gammaproteobacteria-unclassified
    about: {feature: {kind: genus, label: Gammaproteobacteria_unclassified, rank: class}}
    contrast: {kind: pairwise, treatment: HF+XY, reference: HF}
    site: UBERON:0001155
    material: mucosa
    measure: relative_abundance
    direction: increase
    stat: {kind: Q, op: "<", value: 0.05, scope: unknown, source: text}
    effect: null
    figure: "Figure 3"
    section: Treatment Modulation of Microbial Genera in the Colon
    quote: "Moreover, the addition of xylanase to HF increased the abundance of Lactobacillus, Gammaproteobacteria_unclassified, and Ruminococcaceae_UCG-014 in the colonic mucosa, but decreased the abundance of Campylobacter, Streptococcus, and Helicobacter (Q < 0.05)."
    note: "label as printed, rank as resolved (class); shares its sentence with g-col-muc-xy-hf-campylobacter"

  - id: g-col-muc-ax-hf-lactobacillus
    about: {feature: {kind: genus, label: Lactobacillus, rank: genus}}
    contrast: {kind: pairwise, treatment: HF+AX, reference: HF}
    site: UBERON:0001155
    material: mucosa
    measure: relative_abundance
    direction: decrease
    stat: {kind: Q, op: "<", value: 0.05, scope: unknown, source: text}
    effect: null
    figure: "Figure 3"
    section: Treatment Modulation of Microbial Genera in the Colon
    quote: "Within the colonic mucosa, compared with the HF, HF+AX increased the abundance of Prevotella_9 and Gammaproteobacteria_unclassified, but reduced the abundance of Lactobacillus (Q < 0.05)."
    note: "opposite direction to HF+XY in colonic mucosa (Lactobacillus up): a contrast the table must make easy to query"

  - id: g-cae-dig-ax-hf-top20-null
    about: {feature_set: top20-genera-cae-dig}
    contrast: {kind: pairwise, treatment: HF+AX, reference: HF}
    site: UBERON:0001153
    material: digesta
    measure: relative_abundance
    direction: no_difference
    stat: {kind: Q, op: ">", value: 0.10, scope: unknown, source: text}
    effect: null
    figure: null
    section: Treatment Modulation of Microbial Genera in the Cecum
    quote: "The 20 most abundant genera did not differ between HF and HF+AX in the cecal contents (Q > 0.10)"
    note: "a null with its scope: these 20 genera, this contrast, this threshold. Only consistent with a contrast Q (see header)."

  - id: g-cae-ax-hf-streptococcus
    about: {feature: {kind: genus, label: Streptococcus, rank: genus}}
    contrast: {kind: pairwise, treatment: HF+AX, reference: HF}
    site: UBERON:0001153
