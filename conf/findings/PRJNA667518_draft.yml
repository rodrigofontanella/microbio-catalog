    direction: increase
    stat: {kind: Q, op: "<", value: 0.05, scope: unknown, source: text}
    effect: null
    figure: "Figure 8A"
    section: PICRUSt2 Targeted Gene Characterizations
    quote: "The addition of xylanase to HF increased predicted gene counts for acetate kinase, phosphate acetyltransferase, endo-1,4-beta-xylanase, acetate CoA-transferase, xylose isomerase, L-lactate dehydrogenase, and xylulose kinase (Q < 0.05)."
    note: "PICRUSt2 2.3.0b prediction from 16S, not measured gene content; enzyme by name, no EC"

