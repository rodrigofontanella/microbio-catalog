      kind: Q
      op: "<"
      value: 0.05
      scope: unknown
      source: figure_legend
      section: Treatment Modulation of the 200 Most Abundant OTUs in the Cecal Contents
      quote: "or OTUs with a contrast value of Q < 0.05 from the 200 most abundant OTUs among treatments present in the cecal contents."
    effect: null
    figure: "Figure 4A"
    section: Treatment Modulation of the 200 Most Abundant OTUs in the Cecal Contents
    quote: "Compared to LF, HF significantly increased the prevalence of 44, and reduced 19, of the 200 most prevalent OTUs characterized from cecal contents (Figure 4A)."
    note: "a claim about the set; the 63 OTUs behind it are only in the figure"

  # ---- alpha diversity, Figure 1 --------------------------------------------------------------
  - id: a-cae-muc-hf-lf-chao1
    about: {feature: {kind: alpha_index, label: Chao1, rank: otu}}
    contrast: {kind: pairwise, treatment: HF, reference: LF}
    site: UBERON:0001153
    material: mucosa
    measure: alpha_diversity
    direction: increase
    stat: {kind: p, op: "<", value: 0.05, scope: contrast, source: text}
    effect: null
    figure: "Figure 1"
    section: Alpha-Diversity
    quote: "Compared to LF, HF, HF+XY, and HF+AX had greater Chao1 and Shannon indices in the cecal mucosa (p < 0.05), but did not differ for the Simpson index (p = 0.117)."
    note: "the sentence yields 6 pairwise claims (3 treatments × Chao1, Shannon) and the Simpson null; 1 + 1 drafted. Pairwise per Methods (Fisher's LSD)."

  - id: a-cae-muc-simpson-null
    about: {feature: {kind: alpha_index, label: Simpson, rank: otu}}
    contrast: {kind: omnibus, levels: [LF, HF, HF+XY, HF+AX]}
    site: UBERON:0001153
    material: mucosa
    measure: alpha_diversity
    direction: no_difference
    stat: {kind: p, op: "=", value: 0.117, scope: treatment, source: text}
    effect: null
    figure: "Figure 1"
    section: Alpha-Diversity
    quote: "Compared to LF, HF, HF+XY, and HF+AX had greater Chao1 and Shannon indices in the cecal mucosa (p < 0.05), but did not differ for the Simpson index (p = 0.117)."

  - id: a-col-dig-shannon-grouping
    about: {feature: {kind: alpha_index, label: Shannon, rank: otu}}
    contrast: {kind: grouping, higher: [HF, HF+AX], lower: [LF, HF+XY]}
    site: UBERON:0001155
    material: digesta
    measure: alpha_diversity
    direction: increase             # of the 'higher' group relative to the 'lower' group
    stat: {kind: p, op: "<", value: 0.05, scope: contrast, source: text}
    effect: null
    figure: "Figure 1"
    section: Alpha-Diversity
    quote: "For the Shannon and Simpson indices, HF and HF+AX were greater than LF and HF+XY (p < 0.05)."
    note: "kept as the grouping printed; LSD implies the 4 pairs, but expanding them is a later, derived step"

