    measure: relative_abundance
    direction: increase
    stat: {kind: Q, op: "<", value: 0.05, scope: unknown, source: text}
    effect: null
    figure: "Figure 3"
    section: Treatment Modulation of Microbial Genera in the Cecum
    quote: "but HF+AX did increase the abundance of Streptococcus and decreased the prevalence of Campylobacter (Q < 0.05)."
    flags:
      - "check_figure_3: the sentence names no material (curation fact ambiguity-hfax-cecum-site). Set material from Figure 3 if it shows it; otherwise it stays null. Not 'mucosa by elimination'."

  # ---- OTU level, Figures 4–7 -----------------------------------------------------------------
  - id: otu-cae-dig-xy-hf-otu160
